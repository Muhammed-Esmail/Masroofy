{% extends "pages/base/base.html" %}
{% load static %}

{% block title %}Settings{% endblock %}

{% block content %}
    <h2>Settings</h2>
    <div class="settings">
        <h3>update your settings</h3>
        <form method="POST">
            {% csrf_token %}
            {{ settingForm.as_p }}
            <button type="submit" name="btnSettingsUpdate">Save Settings</button>
        </form>
    </div>
    <div class="settings">
        <h3>change your password</h3>
        <form method="POST">
            {% csrf_token %}
            {{ passwordForm.as_p }}
            <button type="submit" name="btnChangePassword">change password</button>
        </form>
    </div>
{% endblock %}
